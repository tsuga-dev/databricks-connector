name: tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pyspark requests pytest ruff
      - run: ruff check src/databricks/labs/community_connector/sources/tsuga_logs tests --exclude "*_generated_*" --exclude "sample-ingest.py"
      - run: python -m pytest tests/ -q
